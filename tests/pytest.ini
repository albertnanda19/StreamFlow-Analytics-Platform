[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --html=tests/reports/report.html
    --self-contained-html
    --log-cli-level=INFO
    --timeout=300
markers =
    unit: Unit tests, no external dependencies
    integration: Integration tests, requires running services
    e2e: End-to-end tests, requires full pipeline running
    slow: Tests that take longer than 60 seconds
    kafka: Tests that interact with Kafka
    spark: Tests that interact with Spark
    dbt: Tests that interact with dbt/ClickHouse
    airflow: Tests that interact with Airflow
    accuracy: Tests that validate data correctness, not just connectivity

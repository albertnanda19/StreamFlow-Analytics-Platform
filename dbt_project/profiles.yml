streamflow:
  target: dev
  outputs:

    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '/tmp/streamflow_dev.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - json

    prod:
      type: clickhouse
      schema: analytics
      host:     "{{ env_var('CLICKHOUSE_HOST',     'localhost') }}"
      port:     "{{ env_var('CLICKHOUSE_PORT',     '8123') | int }}"
      user:     "{{ env_var('CLICKHOUSE_USER',     'streamflow') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'streamflow123') }}"
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300
      sync_request_timeout: 5
      compress_block_size: 1048576
      compression: lz4
      custom_settings:
        max_execution_time: 600
        distributed_ddl_task_timeout: 300

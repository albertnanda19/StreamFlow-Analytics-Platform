streamflow:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: analytics
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'streamflow') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'streamflow123') }}"
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300

name: bronze_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-bronze"

validations:
  - batch_request:
      datasource_name: clickhouse_datasource
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: bronze.orders
    expectation_suite_name: bronze_orders_suite

  - batch_request:
      datasource_name: clickhouse_datasource
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: bronze.pageviews
    expectation_suite_name: bronze_pageviews_suite

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction

  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
      site_names:
        - local_site

  - name: send_slack_notification_on_failure
    action:
      class_name: SlackNotificationAction
      slack_webhook: ${SLACK_WEBHOOK_URL}
      notify_on: failure
      notify_with:
        - local_site
      renderer:
        module_name: great_expectations.render.renderer.slack_renderer
        class_name: SlackRenderer

evaluation_parameters: {}

runtime_configuration:
  result_format:
    result_format: SUMMARY
    include_unexpected_rows: true
    partial_unexpected_count: 20
